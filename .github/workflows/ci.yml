name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two lanes:
#   - unit  (merge gate): hermetic — format + typecheck + lint + `bun test`
#           with RUN_LIVE unset, so every live (network/credential) suite is
#           skipped. Deterministic; never flakes on expired tokens or 429s.
#   - live  (advisory):   runs the same suites with RUN_LIVE=1 and provider
#           credentials from repo secrets. Allowed to fail without blocking a
#           merge (continue-on-error), since provider availability is external.
jobs:
  unit:
    name: unit (merge gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: format (check only)
        run: bunx biome check src tests
      - name: typecheck
        run: bun run typecheck
      - name: lint
        run: bun run lint
      - name: unit tests (live suites skipped)
        run: bun run test:unit

  live:
    name: live (advisory)
    runs-on: ubuntu-latest
    needs: unit
    # Only on pushes to main (and manual runs), not on every PR from forks that
    # cannot access secrets. Never blocks the merge gate.
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: live tests (RUN_LIVE=1)
        env:
          RUN_LIVE: "1"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DASHSCOPE_API_KEY_INTL: ${{ secrets.DASHSCOPE_API_KEY_INTL }}
          EUROUTER_API_KEY: ${{ secrets.EUROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: bun run test:live
